<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>RDS CLOUD KITCHEN | Delivery, Takeaway & Pre-Orders</title>
  
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
  
  <!-- PapaParse for robust CSV loading -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>

  <style>
    @keyframes pulseAlert {
      0%, 100% { opacity: 1; transform: scale(1); }
      50% { opacity: 0.85; transform: scale(0.99); }
    }
  </style>

  <script>
    tailwind.config = {
      theme: {
        extend: {
          fontFamily: { sans: ['"Plus Jakarta Sans"', 'sans-serif'] },
          colors: {
            brand: { 500: '#f97316', 600: '#ea580c', 700: '#c2410c' }
          }
        }
      }
    }
  </script>
</head>
<body class="bg-gradient-to-b from-amber-50/70 via-white to-orange-50/40 text-stone-800 min-h-screen flex flex-col font-sans">

  <!-- 🔒 SITE ACCESS GATEKEEPER -->
  <div id="siteGateScreen" class="fixed inset-0 z-[200] bg-stone-950 flex items-center justify-center p-4">
    <div class="bg-white rounded-3xl max-w-sm w-full p-7 space-y-5 shadow-2xl text-center border border-orange-100">
      <div class="w-16 h-16 rounded-3xl bg-gradient-to-tr from-amber-500 to-orange-600 text-white flex items-center justify-center text-2xl mx-auto shadow-lg shadow-orange-500/30">
        <i class="fa-solid fa-lock"></i>
      </div>
      <div>
        <h1 class="text-xl font-black text-stone-900 tracking-tight">RDS CLOUD KITCHEN</h1>
        <p class="text-xs text-stone-500 mt-1">Please enter password to access kitchen menu.</p>
      </div>
      <form onsubmit="verifySitePassword(event)" class="space-y-3">
        <input id="sitePasswordInput" type="text" autocapitalize="none" autocomplete="off" placeholder="Enter Access Password" required class="w-full p-3 border-2 border-orange-100 rounded-2xl font-bold tracking-wider text-center focus:border-orange-500 focus:outline-none bg-stone-50 text-stone-900 text-sm">
        <p id="sitePassError" class="text-rose-600 text-xs font-bold hidden">Incorrect password. Please try again.</p>
        <button type="submit" class="w-full bg-gradient-to-r from-orange-500 to-amber-500 hover:from-orange-600 text-white font-black py-3.5 rounded-2xl shadow-lg active:scale-95 transition text-sm uppercase tracking-wide cursor-pointer">
          Unlock Webpage
        </button>
      </form>
    </div>
  </div>

  <!-- TOP BAR -->
  <div class="bg-gradient-to-r from-orange-600 via-amber-500 to-orange-500 text-white text-xs font-semibold py-2 px-4 shadow-sm">
    <div class="max-w-6xl mx-auto flex justify-between items-center">
      <span>Operating Timing: <strong>00:30 hrs – 22:00 hrs</strong></span>
      <button onclick="lockPage()" class="bg-black/30 px-3 py-1 rounded-full text-xs font-bold text-amber-200">Lock Page</button>
    </div>
  </div>

  <!-- NAVIGATION -->
  <header class="sticky top-0 z-40 bg-white/95 backdrop-blur-md border-b border-orange-100 shadow-sm">
    <div class="max-w-6xl mx-auto px-4 py-3.5 flex justify-between items-center">
      <div class="flex items-center gap-2.5">
        <div class="w-10 h-10 rounded-2xl bg-gradient-to-tr from-amber-500 to-orange-600 text-white flex items-center justify-center shadow-md">
          <i class="fa-solid fa-utensils text-lg"></i>
        </div>
        <div>
          <h1 class="text-xl font-black tracking-tight text-stone-900 leading-none">RDS <span class="text-orange-600">CLOUD KITCHEN</span></h1>
          <p class="text-[10px] font-bold text-amber-600 uppercase tracking-widest mt-0.5">Breakfast • Lunch • Dinner</p>
        </div>
      </div>
    </div>
  </header>

  <!-- MAIN CONTAINER -->
  <main class="max-w-6xl mx-auto px-4 py-6 space-y-6 flex-grow w-full">

    <!-- CATEGORY PILLS -->
    <div class="flex items-center gap-2 overflow-x-auto pb-1 scrollbar-none">
      <button onclick="filterCategory('All')" class="cat-pill px-4 py-2 rounded-full text-xs font-bold transition whitespace-nowrap bg-stone-900 text-white shadow">All Items</button>
      <button onclick="filterCategory('Breakfast')" class="cat-pill px-4 py-2 rounded-full text-xs font-bold transition whitespace-nowrap bg-white border border-stone-200 text-stone-600">Breakfast</button>
      <button onclick="filterCategory('Lunch')" class="cat-pill px-4 py-2 rounded-full text-xs font-bold transition whitespace-nowrap bg-white border border-stone-200 text-stone-600">Lunch</button>
      <button onclick="filterCategory('Dinner')" class="cat-pill px-4 py-2 rounded-full text-xs font-bold transition whitespace-nowrap bg-white border border-stone-200 text-stone-600">Dinner</button>
    </div>

    <!-- EMPTY STATE -->
    <div id="emptyMenuState" class="text-center py-20 bg-white border border-dashed border-orange-200 rounded-3xl p-8 space-y-3 shadow-sm">
      <div class="w-14 h-14 rounded-full bg-orange-50 text-orange-500 mx-auto flex items-center justify-center text-2xl">
        <i class="fa-solid fa-utensils"></i>
      </div>
      <h3 class="font-extrabold text-stone-800 text-lg">Loading Menu...</h3>
      <p class="text-xs text-stone-500 max-w-sm mx-auto">Pulling live items from Google Sheets.</p>
    </div>

    <!-- MENU GRID -->
    <section id="menuGrid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-6 hidden"></section>
  </main>

  <script>
    const SITE_ACCESS_PASSWORD = "gmskitchen123";
    const SHEET_CSV_URL = "https://docs.google.com/spreadsheets/d/1hLHDIINJidqJjw4vi9BxvIVAMf9tcpOlCiWAZe-9UfY/export?format=csv";

    function checkSiteAccess() {
      const isUnlocked = localStorage.getItem("rds_site_unlocked") === "true";
      const gateScreen = document.getElementById("siteGateScreen");
      if (isUnlocked && gateScreen) {
        gateScreen.classList.add("hidden");
      } else if (gateScreen) {
        gateScreen.classList.remove("hidden");
      }
    }

    function verifySitePassword(e) {
      e.preventDefault();
      const input = document.getElementById("sitePasswordInput");
      const entered = (input?.value || "").trim().toLowerCase();
      const err = document.getElementById("sitePassError");

      if (entered === SITE_ACCESS_PASSWORD) {
        localStorage.setItem("rds_site_unlocked", "true");
        document.getElementById("siteGateScreen").classList.add("hidden");
        if (err) err.classList.add("hidden");
      } else {
        if (err) err.classList.remove("hidden");
        if (input) input.value = "";
      }
    }

    function lockPage() {
      localStorage.removeItem("rds_site_unlocked");
      location.reload();
    }

    let activeMenu = [];
    let activeCategory = 'All';

    function fetchGoogleSheet() {
      Papa.parse(SHEET_CSV_URL, {
        download: true,
        header: true,
        skipEmptyLines: true,
        complete: function(results) {
          if (results.data && results.data.length > 0) {
            activeMenu = results.data.map((row, i) => ({
              id: row.id || `DISH-${i+1}`,
              name: row.name || `Dish ${i+1}`,
              category: row.category || 'Lunch',
              price: Number(row.price) || 100,
              desc: row.desc || '',
              isVeg: String(row.isVeg).toLowerCase() === 'true',
              quantity: Number(row.quantity) || 10,
              image: row.image || 'https://images.unsplash.com/photo-1546069901-ba9599a7e63c'
            }));
            updateUI();
          }
        },
        error: function(err) {
          console.warn("CSV fetch error:", err);
        }
      });
    }

    function filterCategory(cat) {
      activeCategory = cat;
      updateUI();
    }

    function updateUI() {
      const grid = document.getElementById('menuGrid');
      const empty = document.getElementById('emptyMenuState');

      let items = activeMenu;
      if (activeCategory !== 'All') {
        items = activeMenu.filter(i => i.category.toLowerCase() === activeCategory.toLowerCase());
      }

      if (!items || items.length === 0) {
        grid.classList.add('hidden');
        empty.classList.remove('hidden');
      } else {
        empty.classList.add('hidden');
        grid.classList.remove('hidden');
        grid.innerHTML = items.map(item => `
          <div class="bg-white rounded-3xl border border-orange-100 overflow-hidden shadow-sm hover:shadow-xl transition duration-300 flex flex-col justify-between">
            <div>
              <div class="relative w-full h-48 bg-stone-100 overflow-hidden">
                <img src="${item.image}" alt="${item.name}" class="w-full h-full object-cover">
                <div class="absolute top-3 right-3 bg-orange-100 text-orange-900 border px-2.5 py-1 rounded-lg text-[10px] font-black uppercase tracking-wider">
                  ${item.category}
                </div>
              </div>
              <div class="p-4 space-y-2">
                <div class="flex justify-between items-start">
                  <div>
                    <h3 class="font-extrabold text-stone-900 text-base">${item.name}</h3>
                    <span class="font-black text-stone-900 text-base">₹${item.price}</span>
                  </div>
                  <span class="px-2 py-0.5 rounded-md font-black text-[10px] bg-amber-100 text-amber-800">
                    ${item.quantity} Portions Left
                  </span>
                </div>
                <p class="text-xs text-stone-500">${item.desc}</p>
              </div>
            </div>
          </div>
        `).join('');
      }
    }

    function init() {
      checkSiteAccess();
      fetchGoogleSheet();
    }

    window.onload = init;
  </script>
</body>
</html>
